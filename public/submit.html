<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Status Submission | Scrum Master Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .submit-page-wrap {
      max-width: 720px;
      margin: 30px auto;
      width: 100%;
      padding: 0 16px;
    }
    .submit-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .submit-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .portal-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 2px;
    }
    .submit-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .submit-desc {
      font-size: 0.83rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .submit-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      display: block;
    }
    .form-control {
      width: 100%;
      background: #080d17;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      padding: 9px 12px;
      font-size: 0.88rem;
      font-family: var(--font-main);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent-primary);
    }
    .tasks-textarea {
      min-height: 140px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .projects-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .project-card-block {
      background: #111a2a;
      border: 1px solid #1f2f47;
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .project-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .project-badge-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .btn-add-project {
      align-self: flex-start;
      border-style: dashed;
      border-color: var(--accent-primary);
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      font-weight: 600;
    }
    .btn-add-project:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
    }
    .success-box {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #34d399;
      padding: 20px;
      border-radius: var(--radius-md);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .success-box.hidden { display: none; }
  </style>
</head>
<body class="dark-mode">
  <div class="submit-page-wrap">
    <div class="submit-card">
      <div class="submit-header">
        <div class="portal-logo">🚀</div>
        <h1 class="submit-title">Daily Task Submission</h1>
        <p class="submit-desc">Submit your updates across one or multiple projects. It will automatically be sent to Sir at <strong>6:28 PM</strong>.</p>
      </div>

      <div id="successBox" class="success-box hidden">
        <div style="font-size: 1.8rem;">🎉</div>
        <strong id="successMsg" style="font-size: 1.1rem;">Update Submitted Successfully!</strong>
        <p style="font-size: 0.85rem; color: #a7f3d0;">All your projects & tasks have been compiled into today's master status report.</p>
        <button id="btnSubmitAnother" class="btn btn-sm btn-outline" style="margin-top: 10px;">Submit Another Update</button>
      </div>

      <form id="submissionForm" class="submit-form">
        <div>
          <label class="form-label" for="memberNameSelect">Your Name *</label>
          <select id="memberNameSelect" class="form-control" required>
            <option value="">-- Select Your Name --</option>
            <option value="HARSHAD">HARSHAD</option>
            <option value="KIRAN">KIRAN</option>
            <option value="DHRUV">DHRUV</option>
            <option value="PRANAV">PRANAV</option>
            <option value="KARTIK">KARTIK</option>
            <option value="DEVERSH">DEVERSH (Nodejs Developer)</option>
            <option value="RADHEY">RADHEY (Nodejs Developer)</option>
            <option value="AJAY">AJAY (Designer)</option>
            <option value="HASTI">HASTI (Designer)</option>
            <option value="NISARG">NISARG (QA & Scrum Master)</option>
          </select>
        </div>

        <div>
          <label class="form-label">Projects & Tasks *</label>
          <div id="projectsContainer" class="projects-container">
            <!-- Dynamic Project Block 1 -->
            <div class="project-card-block" data-index="0">
              <div class="project-card-header">
                <span class="project-badge-tag">Project #1</span>
              </div>
              <div>
                <input type="text" class="form-control project-name-input" placeholder="Project Name (e.g. RankMyTrip, Crystal Wish app)" required>
              </div>
              <div>
                <textarea class="form-control tasks-textarea project-tasks-input" placeholder="Tasks completed or in progress:
Tabbar UI => Done
Add Vehicle Screen UI => Done
Drive History G-Force Distribution Screen UI => WIP" required></textarea>
              </div>
            </div>
          </div>

          <button type="button" id="btnAddProjectBlock" class="btn btn-sm btn-add-project" style="margin-top: 10px;">
            + Add Another Project (For working on 2+ projects)
          </button>
        </div>

        <div>
          <label class="form-label" for="noteSelect">Status / Attendance Note (Optional)</label>
          <select id="noteSelect" class="form-control">
            <option value="">Full Day (Default)</option>
            <option value="ON HALF DAY">ON HALF DAY</option>
            <option value="ON LEAVE">ON LEAVE</option>
            <option value="WORK FROM HOME">WORK FROM HOME</option>
          </select>
        </div>

        <button type="submit" id="btnSubmitStatus" class="btn btn-primary btn-large" style="margin-top: 8px;">
          🚀 Submit Today's Tasks
        </button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('submissionForm');
    const projectsContainer = document.getElementById('projectsContainer');
    const btnAddProjectBlock = document.getElementById('btnAddProjectBlock');
    const successBox = document.getElementById('successBox');
    const successMsg = document.getElementById('successMsg');
    const btnSubmitAnother = document.getElementById('btnSubmitAnother');

    let projectCount = 1;

    // Add another project block
    btnAddProjectBlock.addEventListener('click', () => {
      projectCount++;
      const block = document.createElement('div');
      block.className = 'project-card-block';
      block.setAttribute('data-index', projectCount - 1);
      block.innerHTML = `
        <div class="project-card-header">
          <span class="project-badge-tag">Project #${projectCount}</span>
          <button type="button" class="btn btn-xs btn-ghost text-red btn-remove-proj">&times; Remove Project</button>
        </div>
        <div>
          <input type="text" class="form-control project-name-input" placeholder="Project Name (e.g. Second Number App, BeForever app)" required>
        </div>
        <div>
          <textarea class="form-control tasks-textarea project-tasks-input" placeholder="Tasks for this project:
Fix bugs (4) => Done
Upload new build => Done" required></textarea>
        </div>
      `;

      block.querySelector('.btn-remove-proj').addEventListener('click', () => {
        block.remove();
      });

      projectsContainer.appendChild(block);
    });

    // Handle Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const member = document.getElementById('memberNameSelect').value;
      const note = document.getElementById('noteSelect').value.trim();

      // Collect all projects
      const projectBlocks = document.querySelectorAll('.project-card-block');
      const projects = [];

      projectBlocks.forEach(block => {
        const pName = block.querySelector('.project-name-input').value.trim();
        const pTasks = block.querySelector('.project-tasks-input').value.trim();
        if (pName && pTasks) {
          projects.push({ name: pName, tasks: pTasks });
        }
      });

      if (projects.length === 0) {
        alert('Please fill in at least one project and tasks.');
        return;
      }

      const btn = document.getElementById('btnSubmitStatus');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      try {
        const res = await fetch('/api/submit-task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ member, projects, note })
        });
        const data = await res.json();
        if (data.success) {
          form.classList.add('hidden');
          successBox.classList.remove('hidden');
          successMsg.textContent = `✓ Thanks ${member}! Your status for ${projects.length} project(s) has been recorded.`;
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Submission failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Submit Today\'s Tasks';
      }
    });

    btnSubmitAnother.addEventListener('click', () => {
      successBox.classList.add('hidden');
      form.classList.remove('hidden');
      // Reset to 1 block
      projectsContainer.innerHTML = `
        <div class="project-card-block" data-index="0">
          <div class="project-card-header">
            <span class="project-badge-tag">Project #1</span>
          </div>
          <div>
            <input type="text" class="form-control project-name-input" placeholder="Project Name (e.g. RankMyTrip, Crystal Wish app)" required>
          </div>
          <div>
            <textarea class="form-control tasks-textarea project-tasks-input" placeholder="Tasks completed or in progress:
Tabbar UI => Done
Add Vehicle Screen UI => Done" required></textarea>
          </div>
        </div>
      `;
      projectCount = 1;
    });
  </script>
</body>
</html>
