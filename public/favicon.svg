<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  
  <!-- Inner Contrast Card -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#0f172a" fill-opacity="0.94"/>

  <!-- Glowing Automation Nodes & Circuit Bars -->
  <!-- Top Task Bar -->
  <rect x="14" y="16" width="36" height="6" rx="3" fill="#334155"/>
  <rect x="14" y="16" width="18" height="6" rx="3" fill="url(#bgGrad)"/>

  <!-- Middle Task Bar with Checkmark -->
  <rect x="28" y="29" width="22" height="6" rx="3" fill="#475569"/>
  <path d="M14 31 L20 37 L32 23" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Bottom Task Bar -->
  <rect x="14" y="43" width="36" height="6" rx="3" fill="#334155"/>
  <rect x="14" y="43" width="24" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Status Pulse Badge -->
  <circle cx="48" cy="46" r="5" fill="#10b981"/>
  <circle cx="48" cy="46" r="2.5" fill="#ffffff"/>
</svg>
